name: Build

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push built images to registry
        type: boolean
        required: false
        default: true
      version_tag:
        description: Release version tag used for artifacts
        type: string
        required: false
  workflow_call:
    inputs:
      push:
        description: Push built images to registry
        type: boolean
        required: false
        default: true
      version_tag:
        description: Release version tag used for artifacts
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GOARCH: ["amd64", "arm64", "arm"]
        GOOS: ["darwin", "linux"]
        exclude:
          - GOARCH: amd64
            GOOS: darwin
          - GOARCH: arm
            GOOS: darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o "./${OUTPUT_NAME}"
        env:
          GOARCH: ${{ matrix.GOARCH }}
          GOOS: ${{ matrix.GOOS }}
          OUTPUT_NAME: cloudflare-ddns-${{ matrix.GOOS }}-${{ matrix.GOARCH }}

      - name: Upload build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-ddns-${{ inputs.version_tag != '' && format('{0}-', inputs.version_tag) || '' }}${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: cloudflare-ddns-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
