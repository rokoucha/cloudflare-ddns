---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ddns

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns

---
# Cloudflare API トークンを設定してください。
# 本番環境では External Secrets Operator や Sealed Secrets などを利用することを推奨します。
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
type: Opaque
stringData:
  CLOUDFLARE_API_TOKEN: "REPLACE_ME"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  selector:
    matchLabels:
      app: cloudflare-ddns
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      serviceAccountName: cloudflare-ddns
      # SIGTERM 受信後、進行中の同期が完了するまでの猶予時間
      terminationGracePeriodSeconds: 30
      containers:
        - name: cloudflare-ddns
          # 本番環境ではイメージダイジェストを固定することを推奨します
          # 例: ghcr.io/rokoucha/cloudflare-ddns@sha256:...
          image: ghcr.io/rokoucha/cloudflare-ddns:latest
          args:
            - "--hostname=$(NODE_NAME)"
            - "--address=$(HOST_IP)"
            - "--watch=5m"
            # ZONE_NAME: 対象の Cloudflare ゾーン名に変更してください
            - "example.com"
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns
                  key: CLOUDFLARE_API_TOKEN
            # Downward API: ノード名をホスト名として使用
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Downward API: ノードのプライマリ IP アドレス
            # デュアルスタック環境では status.hostIP は IPv4 のみを返す場合があります
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      # コントロールプレーンを含む全ノードにスケジュールする
      # ワーカーノードのみに限定する場合はこの設定を削除してください
      tolerations:
        - operator: Exists
